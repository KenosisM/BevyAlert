[package]
name = "ra2engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace]

[dependencies]
# `complex_script_segmentation` 必须开：bevy_text 默认用 parley 的
# `new_for_non_complex_scripts`，那份数据里没有中日文分词模型，UI 上一出现汉字就朝
# stderr 刷 `ICU4X data error: No segmentation model for complex script: Chinese/Japanese`。
# 开了它 → `parley/complex-scripts` → `new_dictionary`，词库编进二进制（compiled_data 本来就开着）。
# 固定与现有 0.20.0-dev / wgpu 30 API 匹配的上游快照。
bevy = { git = "https://github.com/bevyengine/bevy", rev = "6d7f0b30939d7dcc24fdde113716d194997ea8d3", features = ["complex_script_segmentation"] }
# 与 Bevy 走同一个 wgpu（bevy_render 声明 version = "30"）；features 取并集，
# 不会重复编译同一份 wgpu。这里只为了能直接命名 wgpu 的类型（Bevy 只 re-export 了一部分）。
wgpu = { version = "=30.0.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
