; ===========================================================================
;  ra2engine 可调项 —— 【所有可变的东西都写这里】
;
;  · 改完直接重跑，不用重编译。
;  · 命令行同名参数（--units / --cellpx / --albedo / --sun ...）仍可临时覆盖
;    本文件，那是给"跑一张对照图只改一个数"用的；日常调参只改这里。
;  · 本文件是引擎自己的旋钮表：与游戏目录里那个 rulesmd.ini 同名但不同物，
;    后者是引擎按 RA2 规则读取的，别混淆。
;  · 编码 UTF-8。
;  · 优先级：命令行 > 本文件 > 内置默认。
; ===========================================================================

[Launch]
; 地图文件（相对工程根或绝对路径都行）
Map=assets/hillbtwn.map
; 游戏目录：读 MIX / 调色板 / VXL 的地方，必须真实存在
GameDir=RedAlert2/GameMD
; 用哪个 VXL 单位：车体 <Unit>.vxl + 炮塔 <Unit>tur.vxl（mtnk = 天启）
Unit=mtnk
; 摆多少辆
Units=104
; 寻路/战斗风格（传给 costgrid 的地形修正表）
Zone=Track

[View]
; 视口缩放：1 格 = N 屏幕像素（RA2 原版 60）；0 = 自动适配整图
CellPx=60
; 相机看向哪一格 rx,ry；留空 = 地图正中
Look=56,64
; 行军：从 From 走到 To（rx,ry）；留空 = 走自动算的默认点
From=55,64
To=58,64
; 光标进到离屏幕边缘多少像素以内开始平移；0 = 关掉边缘滚动。
EdgeScroll=24
; 平移速度（未缩放的屏幕像素/秒）。
PanSpeed=760

[Sun]
; 太阳方位角（度）：绕世界 +Y 轴，0 = 从 +Z 一侧照来
Azimuth=225
; 太阳仰角（度）：90 = 正上方
Elevation=40
; 法线朝上的面拿到多少倍调色板本色（方向光那一份）
Gain=0.72
; 环境光 / 天空补光倍率。Gain + Sky = 「朝上的面」的总亮度（1.0 = 本色）
Sky=0.28

[Render]
; vxl 漫反射本色增益（1.0 = 调色板本色）。弃用 VPL 后整体偏暗，靠这个提亮；
; 它与 [Sun] 那三个的分工是「表面本身多亮」vs「有多少光打上去」。
Albedo=1.4

; --- 地形上色：贴不贴地形图集（唯一的渲染开关，改这里就切，不用重编译）------------
; 几何只有一份：`terrain::build_mesh` 无条件按地图数据建模（每格菱形柱，四角 =
; level + ramp 表，侧壁落到 y=0）。**没有第二套算法、没有需要两处同步的常数。**
; LogicMesh=0

; 清屏色。magenta / black / white / gray，或 r,g,b（0..255）。
; 【定位色不是配色】没被任何面盖住的像素露的就是它 —— 排查"哪里漏了"时不要改成黑。
ClearColor=magenta
; 方向光阴影贴图边长（2 的幂）。越大影子越锐，显存也越大。
ShadowMapSize=4096
; 阴影开关。1 = 开（VXL 单位在地形上投影），0 = 关。
Shadows=1  贴图模式：从 theater 图集取砖位图（最终形态），受真光源。
; LogicMesh=1  逻辑模式：**不贴任何地形图集**，改用顶点色：顶面按本格 level 取色阶
;              （低处深绿 → 高处浅粉，13 级覆盖 0..12 层），(rx^ry) 为奇的格再乘 0.96
;              做相邻格交替；侧面按朝向三档压暗（右下 0.62 / 上下 0.52 / 左上 0.44）。
;              **不吃真光源**（材质 unlit），明暗全部来自顶点色，方便一眼读几何。
;              ⚠️ 只换上色/材质，**几何一行不变**：贴图模式与逻辑模式共用同一批顶点。
LogicMesh=0

; ============================================================================
;  地形几何（`terrain::build_mesh`）—— 改完直接重跑，不用重编译
; ============================================================================
[Terrain]
; 顶面 UV 向槽内缩多少**纹素**。0 = 正好铺满整槽（边缘会采到槽外的空白 = 洋红点）。
FaceInset=0.5
; 墙脚比低侧顶面再往下埋多少**层**。共边处漏 1px 时调大一点，让地面盖住（0.1~0.5）。
WallFootDrop=0.0
; 坡砖四角高度倍率。1 = ramp 表原值（13..16 号陡坡跨两层）；0.5 = 斜坡整体减半。
RampScale=1.0
; 逻辑模式顶面的相邻格交替明暗（(rx^ry) 为奇的格乘这个数）。
TopAltShade=0.96
; 高差小于这么多层的格边不出墙（防止浮点尾差生成 1px 高的墙，那种墙的贴图会被压成竖条）。
MinWallHeight=0.05
; 坡砖贴图来源：1 = 用 unproject_slope 逆推的坡槽（干净但砖外 14% 是填色）；
;                 0 = 和普通砖一样用主菱形槽（原版怎么画就怎么贴）。
SlopeProjected=0

; ============================================================================
;  窗口 / 截图
; ============================================================================
[Window]
; 窗口尺寸 = 截图分辨率。
Width=1280
Height=720

[Shot]
; RA2_SHOT 开拍的时刻（秒）与拍完再停留多久（秒）。
Delay=2.5
Hold=2.5

; ============================================================================
;  模拟
; ============================================================================
[Sim]
; 固定步进频率（Hz）。改它改变单位运动的平滑度与寻路步长。
TickHz=60
; 运动层：0 = 旧的离散重力碗（稳），1 = 连续人群层（新，尚未在真实地图上验过）。
Crowd=0
